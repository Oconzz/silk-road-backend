variables:
  AWS_ACCESS_KEY_ID : ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_REGION: ${AWS_REGION}
  AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
  AWS_BACK_END_ENV: ${AWS_BACK_END_ENV}
  AWS_BACK_END_APP: ${AWS_BACK_END_APP}
  AWS_BACK_END_ENV_STAGING: ${AWS_BACK_END_ENV_STAGING}
  AWS_BACK_END_APP_STAGING: ${AWS_BACK_END_APP_STAGING}
  BUILD_IMAGE: ${BACK_END_BUILD_IMAGE}
  DEPLOY_IMAGE: ${AWS_DEPLOY_IMAGE}
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  
stages:
  #- test
  - build
  - deploy
  - deploy_staging
  - cleanup


