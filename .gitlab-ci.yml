build:
  stage: build
  image: $BUILD_IMAGE
  tags:
    - build
    
  script:
    - apt-get update
    - apt-get install -y zip unzip tree
    - cd APIServer
    
    - dotnet restore APIServer.csproj --force
    - dotnet nuget locals all --clear
    
    - dotnet publish APIServer.csproj --configuration Debug --output published /p:CopyLocalLockFileAssemblies=true /p:UseAppHost=true /p:GenerateDocumentationFile=true /p:GenerateRuntimeConfigurationFiles=true /p:RollForward=LatestMinor /p:GenerateSwaggerDocument=true --self-contained true

    - cd published
    
    - zip -9 -r ${CI_PIPELINE_ID}.zip . -x "refs/*" -x "refs/**/*"

  artifacts:
    paths:
      - APIServer/published/${CI_PIPELINE_ID}.zip
    expire_in: 1 days
  only:
    - Production
    - Staging

deploy:
  stage: deploy
  image: $DEPLOY_IMAGE
  dependencies:
    - build

  script:
    # Set AWS credentials (use GitLab CI/CD variables for security)
    - export AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
    - export AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    - export AWS_DEFAULT_REGION=${AWS_REGION}
    - VERSION_LABEL="app-$(date +%Y%m%d%H%M%S)"
    - aws s3 cp "./APIServer/published/$CI_PIPELINE_ID.zip" "s3://${AWS_BUCKET_NAME}/${VERSION_LABEL}.zip" --region $AWS_REGION
    - aws elasticbeanstalk create-application-version --application-name $AWS_BACK_END_APP --version-label $VERSION_LABEL --source-bundle S3Bucket="$AWS_BUCKET_NAME",S3Key="$VERSION_LABEL.zip"
    - aws elasticbeanstalk update-environment --environment-name $AWS_BACK_END_ENV --version-label $VERSION_LABEL
  only:
    - Production

 
deploy_staging:
  stage: deploy_staging
  image: $DEPLOY_IMAGE
  dependencies:
    - build

  script:
    # Set AWS credentials (use GitLab CI/CD variables for security)
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export AWS_DEFAULT_REGION=${AWS_REGION}
    - VERSION_LABEL="app-$(date +%Y%m%d%H%M%S)"
    - aws sts get-caller-identity
    - aws s3 cp "./APIServer/published/${CI_PIPELINE_ID}.zip" "s3://${AWS_BUCKET_NAME}/${VERSION_LABEL}.zip" --region "${AWS_REGION}"
    - aws elasticbeanstalk create-application-version --application-name ${AWS_BACK_END_APP_STAGING} --version-label ${VERSION_LABEL} --source-bundle S3Bucket="${AWS_BUCKET_NAME}",S3Key="${VERSION_LABEL}.zip" --region "${AWS_REGION}"
    - aws elasticbeanstalk update-environment --environment-name ${AWS_BACK_END_ENV_STAGING} --version-label ${VERSION_LABEL} --region "${AWS_REGION}"
  only:
    - Staging

cleanup:
  stage: cleanup
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker rmi $BUILD_IMAGE || true
    - docker rmi $DEPLOY_IMAGE || true
  when: always